<html>
    <head>
 <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
        
    </head> 
    <body class="bod">
        
     <div class="w-75 m-auto py-5 ">
        <div class="form-group font-weight-bold">
            <label for="productName">productName :</label>
            <input type="text" name="" id="productName" class="form-control">
        </div>
        <div class="form-group font-weight-bold">
            <label for="productPrice">productPrice :</label>
            <input type="number" name="" id="productPrice" class="form-control">
        </div>
        <div class="form-group font-weight-bold">
            <label for="productCategory">productCategory :</label>
            <input type="text" name="" id="productCategory" class="form-control">
        </div>
        <div class="form-group font-weight-bold">
            <label for="productDesc">productDesc :</label>
            <textarea name="" id="productDesc" class="form-control"></textarea>
        </div>
        <button id="mainBtn" onclick="addProduct()" class="btn btn-primary">add product</button>
     </div>
     <div class="w-75 m-auto py-5">
        <input onkeyup="searchProduct(this.value)" type="text" placeholder="Search Product" class="form-control w-75 m-auto ">
        <table class="table my-5 text-center bg-danger">
            <thead>
                <th>Index</th>
                <th>productName</th>
                <th>productPrice</th>
                <th>productCategory</th>
                <th>productDesc</th>
                <th>Update</th>
                <th>Delete</th>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
     </div>

        <script src="js/script.js"></script>
    </body>
</html>
